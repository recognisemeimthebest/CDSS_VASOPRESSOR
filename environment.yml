name: cdss_vasopressor
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - psycopg2
  - sqlalchemy
  - pandas
  - numpy<2  # 2.x has ABI break with torch 2.5.x → segfault on .to_numpy()/parquet load
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - jupyterlab
  - tqdm
  - python-dotenv
  - pytorch
  - torchvision
  - pytorch-cuda=12.1
  - pip:
      - streamlit
      - plotly
      - lightgbm>=4.5
      - optuna>=4.0
      - optuna-dashboard>=0.15
